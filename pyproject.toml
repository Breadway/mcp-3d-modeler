[project]
name = "mcp-3d-modeler"
version = "0.1.0"
description = "MCP server exposing CadQuery, Blender, trimesh, and OpenSCAD as 3D modeling tools for LLMs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.29.0,<2.0.0",
    "cadquery>=2.5.2",
    "trimesh>=4.0.0",
    "manifold3d>=3.0.0",
    "numpy",
    "pillow",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp3d"]
